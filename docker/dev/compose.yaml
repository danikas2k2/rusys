services:
  rusys-db:
    container_name: rusys-db
    image: mongo
    ports:
      - "30201:30201"
    volumes:
      - rusys-db-data:/data/db
    restart: unless-stopped
    command: ["mongod", "--replSet", "rusys-rs", "--port", "30201", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "30201", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 2s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          memory: 1g

  rusys-db-init:
    image: mongo
    depends_on:
      rusys-db:
        condition: service_healthy
    restart: "no"
    command:
      - mongosh
      - mongodb://rusys-db:30201/?directConnection=true
      - --quiet
      - --eval
      - >-
        try { rs.status() } catch (error) { rs.initiate({ _id: 'rusys-rs', members: [{ _id: 0, host: 'localhost:30201' }] }) }

volumes:
  rusys-db-data:
