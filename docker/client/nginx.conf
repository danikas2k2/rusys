server {
    listen 80;
    server_name _;

    return 301 https://$host:4000$request_uri;
}

server {
    listen 4000 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/csp-hashes.conf;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' https://fonts.gstatic.com; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: https://lh3.googleusercontent.com https://lh4.googleusercontent.com https://*.googleusercontent.com https://www.gravatar.com https://secure.gravatar.com; object-src 'none'; script-src 'self' https://accounts.google.com; script-src-attr 'none'; script-src-elem 'self' https://accounts.google.com $csp_inline_script_hashes; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; upgrade-insecure-requests; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://accounts.google.com https://openidconnect.googleapis.com https://www.googleapis.com; frame-src 'self' https://accounts.google.com" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location /images/ {
        proxy_pass http://rusys-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location ~ ^/(export|import|clientId|checkUser|summary|products|groups|variants|history|userProfiles|userProfile)(/|$) {
        proxy_pass http://rusys-server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
