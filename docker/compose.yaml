name: rusys-app

services:
  rusys-db:
    container_name: rusys-db
    hostname: rusys-db
    image: mongo:latest
    expose:
      - 27017
    volumes:
      - rusys-db-data:/data/db
    restart: unless-stopped
    networks:
      - rusys-net
    command: ["mongod", "--replSet", "rusys-rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ hello: 1 }).isWritablePrimary || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  rusys-client:
    container_name: rusys-client
    image: rusys-client
    build:
      context: ..
      dockerfile: docker/client/Dockerfile
      args:
        APP_VERSION: "3.13.4"
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - rusys-server
    environment:
      PORT: ${PORT:-3000}
      HTTPS_PORT: ${HTTPS_PORT:-4000}
      NGINX_ENVSUBST_FILTER: "^(PORT|HTTPS_PORT)$"
    expose:
      - "${PORT:-3000}"
      - "${HTTPS_PORT:-4000}"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${HTTPS_PORT:-4000}:${HTTPS_PORT:-4000}"
    networks:
      - rusys-net
    volumes:
      - /volume1/docker/rusys-app/certs:/etc/nginx/certs:ro

  rusys-server:
    container_name: rusys-server
    image: rusys-server
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
      args:
        APP_VERSION: "3.13.4"
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOCALE: ${LOCALE}
      TZ: ${TZ}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_ALLOWED_USERS: ${GOOGLE_ALLOWED_USERS}
      DB: ${DB}
      IMAGES_DIR: ${IMAGES_DIR:-/app/data/images}
    depends_on:
      rusys-db:
        condition: service_healthy
    expose:
      - 3000
    networks:
      - rusys-net
    volumes:
      - /volume1/docker/rusys-app/images:/app/data/images

networks:
  rusys-net:
    driver: bridge

volumes:
  rusys-db-data:
