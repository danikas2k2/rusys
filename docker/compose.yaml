name: rusys-app

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      APP_VERSION: "4.2.10"
  platform: linux/amd64
  restart: unless-stopped
  environment: &app-environment
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    PORT: 3000
    LOCALE: ${LOCALE}
    TZ: ${TZ}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    GOOGLE_ALLOWED_USERS: ${GOOGLE_ALLOWED_USERS}
    DB: ${DB}
    IMAGES_DIR: ${IMAGES_DIR:-/app/data/images}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://${OTLP_PRIVATE_IP:-172.30.79.2}:4318/v1/traces
  depends_on:
    rusys-db:
      condition: service_healthy
  expose:
    - 3000
  networks:
    - rusys-net
    - traces-private
  volumes:
    - /volume1/docker/rusys-app/images:/app/data/images
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  traces:
    container_name: rusys-traces
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    environment: &traces-environment
      OTLP_LISTEN_ADDRESS: ${OTLP_PRIVATE_IP:-172.30.79.2}:4318
      GC_OTLP_ENDPOINT: ${GC_OTLP_ENDPOINT:?Set GC_OTLP_ENDPOINT in the NAS .env}
      GC_OTLP_USER: ${GC_OTLP_USER:?Set GC_OTLP_USER in the NAS .env}
      GC_OTLP_TOKEN: ${GC_OTLP_TOKEN:?Set GC_OTLP_TOKEN in the NAS .env}
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "/etc/alloy/traces.alloy"]
    networks:
      traces-private:
        ipv4_address: ${OTLP_PRIVATE_IP:-172.30.79.2}
      traces-egress:
    volumes: &traces-volumes
      - ./monitoring/traces.alloy:/etc/alloy/traces.alloy:ro
    mem_limit: 256m
    cpus: 0.5

  traces-validate:
    image: grafana/alloy:v1.20.1
    profiles: [tools]
    network_mode: none
    environment: *traces-environment
    volumes: *traces-volumes
    command: ["validate", "/etc/alloy/traces.alloy"]

  rusys-db:
    container_name: rusys-db
    hostname: rusys-db
    image: mongo:latest
    expose:
      - 27017
    volumes:
      - rusys-db-data:/data/db
      - ${DB_KEYFILE}:/etc/mongo-keyfile:ro
    restart: unless-stopped
    networks:
      - rusys-net
    command: ["mongod", "--replSet", "rusys-rs", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ hello: 1 }).isWritablePrimary || quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12

  rusys-gateway:
    container_name: rusys-gateway
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    networks:
      - rusys-net
    volumes:
      - ../.deploy/nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6

  rusys-app-blue:
    <<: *app
    environment:
      <<: *app-environment
      APP_SLOT: blue
    container_name: rusys-app-blue
    image: rusys-app-blue
    profiles: [blue]

  rusys-app-green:
    <<: *app
    environment:
      <<: *app-environment
      APP_SLOT: green
    container_name: rusys-app-green
    image: rusys-app-green
    profiles: [green]

  monitoring:
    container_name: rusys-monitoring
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    privileged: true
    environment:
      GC_METRICS_URL: ${GC_METRICS_URL:?Set GC_METRICS_URL in the server .env}
      GC_METRICS_USER: ${GC_METRICS_USER:?Set GC_METRICS_USER in the server .env}
      GC_METRICS_TOKEN: ${GC_METRICS_TOKEN:?Set GC_METRICS_TOKEN in the server .env}
      GC_LOKI_URL: ${GC_LOKI_URL:?Set GC_LOKI_URL in the NAS .env}
      GC_LOKI_USER: ${GC_LOKI_USER:?Set GC_LOKI_USER in the NAS .env}
      GC_LOKI_TOKEN: ${GC_LOKI_TOKEN:?Set GC_LOKI_TOKEN in the NAS .env}
      DB_MONITORING_URI: ${DB_MONITORING_URI:?Set DB_MONITORING_URI in the NAS .env after the MongoDB authorization rollout}
    command:
      [
        "run",
        "--server.http.listen-addr=127.0.0.1:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]
    network_mode: host
    volumes:
      - monitoring-alloy-data:/var/lib/alloy/data
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /var/run:/var/run:ro
      - ${DOCKER_ROOT_DIR:?Set DOCKER_ROOT_DIR to the NAS DockerRootDir in the server .env}:/var/lib/docker:ro

networks:
  traces-private:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${OTLP_PRIVATE_SUBNET:-172.30.79.0/24}
  traces-egress:
    driver: bridge
  rusys-net:
    driver: bridge

volumes:
  rusys-db-data:
  monitoring-alloy-data:
