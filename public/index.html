<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Rūsys</title>
        <meta name="description" content="Rūsio tūrinio apskaita" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Rūsys" />
        <meta name="apple-touch-fullscreen" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <meta name="color-scheme" content="light dark" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="icon" href="/favicon.ico" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="512x512" href="/assets/logo-512.png" />
        <link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-64.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-32.png" />
        <link rel="icon" type="image/png" sizes="24x24" href="/assets/logo-24.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/logo-16.png" />
        <link rel="apple-touch-icon" href="/assets/logo.svg" />
        <link rel="apple-touch-icon" sizes="512x512" href="/assets/logo-512.png" />
        <link rel="apple-touch-icon" sizes="64x64" href="/assets/logo-64.png" />
        <link rel="apple-touch-icon" sizes="32x32" href="/assets/logo-32.png" />
        <link rel="apple-touch-icon" sizes="24x24" href="/assets/logo-24.png" />
        <link rel="apple-touch-icon" sizes="16x16" href="/assets/logo-16.png" />
        <meta name="msapplication-TileColor" content="#eff1f5" media="(prefers-color-scheme: light)" />
        <meta name="msapplication-TileColor" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <style>
            :root {
                --color-text: #4c4f69;
                --color-base: #eff1f5;
                --color-blue: #1e66f5;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --color-text: #cdd6f4;
                    --color-base: #1e1e2e;
                    --color-blue: #89b4fa;
                }
            }

            html,
            body {
                color: var(--color-text);
                background: var(--color-base);
            }

            .loader {
                --loader-color: var(--color-blue);
                --loader-size: 2.75rem;

                display: flex;
                align-items: center;
                justify-content: space-between;
                position: fixed;
                width: var(--loader-size);
                height: var(--loader-size);
                inset: 0;
                margin: auto;
                gap: calc(var(--loader-size) / 5);
            }

            .loader span {
                display: block;
                width: 20%;
                height: 100%;
                background: var(--loader-color);
                border-radius: 0.125rem;
                animation: loader-bars 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
                flex: 1;
            }

            .loader span:nth-child(1) {
                animation-delay: -240ms;
            }

            .loader span:nth-child(2) {
                animation-delay: -120ms;
            }

            .loader span:nth-child(3) {
                animation-delay: 0s;
            }

            @keyframes loader-bars {
                0% {
                    transform: scale(0.6);
                    opacity: 0;
                }

                50%,
                100% {
                    transform: scale(1);
                }
            }
        </style>
        <script>
            (function () {
                document.documentElement.setAttribute(
                    "data-mantine-color-scheme",
                    window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
                );
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root">
            <div class="loader">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </body>
</html>
