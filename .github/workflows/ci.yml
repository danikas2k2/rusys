name: CI on main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (${{ matrix.check.name }})
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Formatting
            command: format:check
          - name: TypeScript
            command: lint:ts
          - name: ESLint
            command: lint:es
          - name: Stylelint
            command: lint:styles
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check.name }}
        run: pnpm ${{ matrix.check.command }}

  build-check:
    needs: lint
    runs-on: ubuntu-latest
    name: Build and check workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run test coverage
        run: pnpm test:coverage

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    name: Playwright E2E
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    needs: lint
    runs-on: ubuntu-latest
    name: Lighthouse accessibility
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Install Lighthouse browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse CI accessibility audits
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-reports
          path: .lighthouseci/
          retention-days: 7

  visual:
    needs: lint
    runs-on: xcode-27
    name: Playwright visual snapshots (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install ${{ matrix.browser }}

      - name: Compare visual snapshots
        run: pnpm test:visual --project='*${{ matrix.browser }}*'

      - name: Upload Playwright visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
