name: CI on main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (${{ matrix.check.name }})
    strategy:
      fail-fast: true
      matrix:
        check:
          - name: Formatting
            command: format:check
          - name: TypeScript
            command: lint:ts
          - name: ESLint
            command: lint:es
          - name: Stylelint
            command: lint:styles
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.check.name }}
        run: pnpm ${{ matrix.check.command }}

  build-check:
    runs-on: ubuntu-latest
    name: Build and check workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run test coverage
        run: pnpm test:coverage

  e2e:
    runs-on: ubuntu-latest
    name: Playwright E2E
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}-browser-e2e
      cancel-in-progress: false
    steps:
      - name: Check whether lint failed
        uses: actions/download-artifact@v4
        with:
          pattern: lint-failed-${{ github.run_attempt }}-e2e
          path: .ci-lint-status
          merge-multiple: true

      - name: Stop when lint failed
        run: test ! -f .ci-lint-status/lint-failed

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse accessibility
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}-browser-lighthouse
      cancel-in-progress: false
    steps:
      - name: Check whether lint failed
        uses: actions/download-artifact@v4
        with:
          pattern: lint-failed-${{ github.run_attempt }}-lighthouse
          path: .ci-lint-status
          merge-multiple: true

      - name: Stop when lint failed
        run: test ! -f .ci-lint-status/lint-failed

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Install Lighthouse browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Lighthouse CI accessibility audits
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-reports
          path: .lighthouseci/
          retention-days: 7

  visual:
    runs-on: xcode-27
    name: Vitest visual snapshots (${{ matrix.browser }})
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}-browser-visual-${{ matrix.browser }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Check whether lint failed
        uses: actions/download-artifact@v4
        with:
          pattern: lint-failed-${{ github.run_attempt }}-visual-${{ matrix.browser }}
          path: .ci-lint-status
          merge-multiple: true

      - name: Stop when lint failed
        run: test ! -f .ci-lint-status/lint-failed

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install ${{ matrix.browser }}

      - name: Compare Vitest visual snapshots
        run: pnpm test:visual --project='*${{ matrix.browser }}*'

      - name: Upload Vitest visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-visual-diffs-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  cancel-browser-on-lint-failure:
    needs: lint
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [e2e, lighthouse, visual-chromium, visual-webkit]
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}-browser-${{ matrix.target }}
      cancel-in-progress: true
    steps:
      - name: Mark lint failure for late browser jobs
        run: touch lint-failed

      - name: Publish lint failure marker
        uses: actions/upload-artifact@v4
        with:
          name: lint-failed-${{ github.run_attempt }}-${{ matrix.target }}
          path: lint-failed
          retention-days: 1
