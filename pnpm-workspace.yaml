packages:
  - "."

allowBuilds:
  # Vite 8 keeps esbuild as an optional compatibility peer. It is not used by
  # this project's build configuration, but pnpm requires its install script
  # to be explicitly approved when the optional package is present.
  esbuild: true
  mongodb-memory-server: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    "@css-modules-kit/core>typescript": "6"

overrides:
  braces: ^3.0.3
  deepmerge-ts: ^8.0.2
  diff: ^9.0.0
  glob: ^13.0.6
  jsdom: ^30.1.1
  micromatch: ^4.0.8
  minimatch: ^10.2.6
  nth-check: ^3.0.1
  parse5: ^8.0.1
  postcss: ^8.5.28
  qs: ^6.16.0
  sane: ^5.0.1
  stylelint: ^17.16.0
  test-exclude: ^8.0.0
  tough-cookie: ^6.0.2
