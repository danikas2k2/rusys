packages:
  - "."

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  # Vite 8 keeps esbuild as an optional compatibility peer. It is not used by
  # this project's build configuration, but pnpm requires its install script
  # to be explicitly approved when the optional package is present.
  esbuild: true
  mongodb-memory-server: true
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    "@css-modules-kit/core>typescript": "6"

overrides:
  # Faro accepts 1.9, while its OpenTelemetry 2.x dependencies require an API below 1.10.
  "@opentelemetry/api": 1.10.0
  braces: ^3.0.3
  deepmerge-ts: ^8.0.2
  diff: ^9.0.0
  glob: ^14.0.3
  ip-address: ^10.7.5
  jsdom: ^30.1.3
  micromatch: ^4.0.8
  minimatch: ^11.0.2
  nth-check: ^3.0.1
  parse5: ^8.0.1
  postcss: ^8.5.32
  qs: ^6.17.0
  sane: ^5.0.1
  stylelint: ^17.16.0
  test-exclude: ^8.0.0
  tmp: ^0.2.7
  tough-cookie: ^6.0.2
